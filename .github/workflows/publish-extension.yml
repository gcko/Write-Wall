name: Publish Extension

# The release kickoff is a tag push and nothing else:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag is the source of truth for the version. validate enforces strict
# semver, forward-only versioning, and that the tagged commit is on main;
# publish syncs the version files to the tag before building, so the store
# always receives the tagged version even if the repo files lag; release
# mirrors the CHANGELOG section into a GitHub release; sync-versions opens a
# PR when the repo files lagged the tag.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag is strict semver
        id: semver
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH. Pre-release and partial tags are not published."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tag only moves forward
        run: |
          prev=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -1)
          if [ -z "$prev" ]; then
            echo "No previous release tag; $GITHUB_REF_NAME is the first."
            exit 0
          fi
          highest=$(printf '%s\n%s\n' "$prev" "$GITHUB_REF_NAME" | sort -V | tail -1)
          if [ "$highest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not sort above the highest existing tag ($prev). Versions only go up; delete nothing, tag higher."
            exit 1
          fi
          echo "$GITHUB_REF_NAME sorts above $prev"

      - name: Tagged commit is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Merge to main first, then tag."
            exit 1
          fi

      - name: Changelog has a section for this version
        run: |
          if ! grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## [${GITHUB_REF_NAME#v}]' section. The GitHub release will fall back to a changelog link."
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.sync.outputs.drift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Sync version files to the tag
        id: sync
        run: |
          out=$(node scripts/set-version.cjs "${{ needs.validate.outputs.version }}")
          echo "$out"
          if echo "$out" | grep -q 'versions-updated'; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json / public/manifest.json lagged tag ${GITHUB_REF_NAME}. Building with the tag version; a sync PR will be opened."
          fi

      - name: Verify versions in workspace
        run: node scripts/verify-version.cjs

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Verify package archive
        run: test -f app.zip

      - name: Built manifest matches the tag
        run: |
          zipver=$(unzip -p app.zip manifest.json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))")
          if [ "$zipver" != "${{ needs.validate.outputs.version }}" ]; then
            echo "::error::app.zip manifest version ($zipver) does not match the tag (${{ needs.validate.outputs.version }})."
            exit 1
          fi

      - name: Upload & publish
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: app.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog section
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it untouched."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  sync-versions:
    needs: [validate, publish]
    if: needs.publish.outputs.drift == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Open version sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BRANCH="chore/sync-version-v${VERSION}"
          git switch -c "$BRANCH"
          node scripts/set-version.cjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/manifest.json
          git commit -s -m "chore(release): sync versions to ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(release): sync versions to ${VERSION}" \
            --body "Tag v${VERSION} was published while package.json / public/manifest.json still carried an older version. The store received the tagged version (the publish job builds from the tag), so this PR only brings the repo files back in line. Note: PRs opened by the Actions token do not trigger CI; push an empty commit or close and reopen if you want checks to run."
